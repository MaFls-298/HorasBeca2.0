<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inicio de Sesión</title>
  <style>
    body {
      font-family: "Segoe UI", Verdana, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background-color: white;
      padding: 40px 45px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }

    h2 {
      margin-bottom: 25px;
      color: #1f2937;
      font-size: 1.4em;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 0.95em;
    }

    input:focus {
      border-color: #46eb25ab;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      background-color: #15bb06b2;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1em;
      cursor: pointer;
    }

    button:hover {
      background-color: #1c8b00ab;
    }

    #resultado {
      margin-top: 15px;
      color: #b91c1c;
      font-weight: 500;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8em;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Iniciar Sesión</h2>
    <input id="email" type="email" placeholder="Correo Institucional" required>
    <input id="password" type="password" placeholder="Contraseña" required>
    <button onclick="login()">Ingresar</button>
    <p id="resultado"></p>
  </div>

  <footer>© 2025 Universidad Del Valle de Guatemala</footer>

<!--//////////////////////////////////////-->>  
  <script>
    async function login(){ 
      const body = { 
        email: document.getElementById('email').value, 
        password: document.getElementById('password').value, 
      }; 
        
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      
      const data = await res.json();
      
      console.log("Res. server:", data);
      if (data.success) {
        
        localStorage.setItem('usuario', JSON.stringify({
        id: data.id, 
        nombre: data.nombre,       
        tipoUsuario: data.tipoUsuario, 
        email: data.email  
      }));
      console.log("Usuario saved in localStorage:", localStorage.getItem('usuario'));

    
      if (data.tipoUsuario === "Encargado") {
        window.location.href = 'encargado.html';
      } else if (data.tipoUsuario === "Alumno") {
        window.location.href = 'alumno.html';
      }
        } else {
          document.getElementById('resultado').textContent = "😡 Credenciales inválidas";
        }
      }
  
  </script>
  </body>
</html>
