<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Encargado - Horas Beca</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
    
    <div class="container">
        <header>
            <h1>Panel del Encargado</h1>
            <div class="logout">
                <span id="encargadoNombre"></span>
                <button onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>

<!-- Tabs -->
  <div class="tabs">
    <button class="tab-button active" onclick="openTab('publicar')">Publicar Actividad</button>
    <button class="tab-button" onclick="openTab('misActividades')">Mis Actividades</button>
    
  </div>

    <!-- Publicar Actividad -->
  <div id="publicar" class="tab-content active">
    <section>
      <h2>Publicar nueva actividad</h2>
      <form id="formNuevaActividad">
        <input type="text" id="titulo" placeholder="Título" required><br>
        <textarea id="descripcion" placeholder="Descripción" required></textarea><br>
        <input type="number" id="horas" placeholder="Horas otorgadas" required><br>
        <input type="number" id="cupoMaximo" placeholder="Cupo máximo" required><br>
        <input type="date" id="fecha" required><br>
        <input type="time" id="hora" required><br>
        <button type="button" onclick="publicarActividad()">Publicar</button>
      </form>
    </section>
  </div>


<!--  tab mis actividades     -->


<div id="misActividades" class="tab-content" style="display:none;">
  <section>
    <h2>Actividades Publicadas</h2>

      <div id="cards" class="cards-container"></div>
      
    </div>
  </section>
</div>

<div id="detallesDetalles" class="detalles">
  <div class="detalles-content">
      <span class="close" onclick="cerrarDetalles()">&times;</span>
      <div id="detallesContenido"></div>
  </div>
</div>

<!-- Edit Activ  -->
<div id="modalEditarActividad" class="popup-card">
    <div class="popup-card-content">
        <h2>Editar Actividad</h2>
        <form id="formEditarActividad">
            <input type="hidden" id="editActividadId">

            <label>Título:</label>
            <input type="text" id="editTitulo" required>

            <label>Descripción:</label>
            <textarea id="editDescripcion" required></textarea>

            <label>Horas Otorgadas:</label>
            <input type="number" id="editHoras" required>

            <label>Cupo Máximo:</label>
            <input type="number" id="editCupo" required>

            <label>Fecha:</label>
            <input type="date" id="editFecha" required>

            <label>Hora:</label>
            <input type="time" id="editHora">

            <div class="popup-buttons">
                <button type="submit">Guardar</button>
                <button type="button" onclick="cerrarModalEditar()">Cancelar</button>
            </div>
        </form>
    </div>
</div>







    <!-- /////////////////////////////////////// -->
  
  <script src="encargado.js"></script>
  
</body>
</html>
